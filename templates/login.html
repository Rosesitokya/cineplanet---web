<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Cineplanet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <form method="POST" action="/login" style="background: #1a2a47; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 20px;">Iniciar Sesión</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alerta alerta-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <input type="email" name="correo" placeholder="Correo electrónico" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: none;">
        <input type="password" name="contrasena" placeholder="Contraseña" required style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: none;">
        
        <button type="submit" class="btn-comprar" style="width: 100%; justify-content: center;">Ingresar</button>
        
        <p style="margin-top: 20px; font-size: 14px; color: #a0a5b1;">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}" style="color: #ffd500; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
        </p>
        <p style="margin-top: 10px; font-size: 13px;">
            <a href="{{ url_for('inicio') }}" style="color: #a0a5b1; text-decoration: none;">← Volver a la cartelera</a>
        </p>
    </form>

</body>
</html>
